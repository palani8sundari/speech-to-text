# One-click deploy on Render: New + > Blueprint > select this repo.
services:
  - type: web
    name: vaani-speech-to-text
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false            # set in the Render dashboard
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.5-transcribe-live
      - key: DATABASE_URL
        fromDatabase:
          name: vaani-db
          property: connectionString

databases:
  - name: vaani-db
    plan: free
    databaseName: speech_to_text
